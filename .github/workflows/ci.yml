name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # `tsc -b` also compiles server/src (tsconfig.contract.json), so the server's own types must be installed.
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm run lint
      # Fails when coverage drops below the thresholds in vite.config.ts (80 %).
      - run: npm run coverage
      - name: Server lint, typecheck and tests (coverage thresholds)
        run: |
          npm run lint --prefix server
          npm run typecheck --prefix server
          npm run coverage --prefix server
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - name: E2E against the dev server (desktop, iPad, phone)
        run: npm run e2e
      - name: PWA checks against the production build (service worker, offline, update)
        run: npm run e2e:pwa
      # Builds server/ and runs the real accounts + sync flow against it (throwaway database, test-only invite code).
      - name: Accounts and sync against the real API
        run: npm run e2e:sync
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
