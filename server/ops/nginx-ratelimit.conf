# http {} context ONLY (limit_req_zone is not allowed inside server/location).
# Install:  sudo cp ops/nginx-ratelimit.conf /etc/nginx/conf.d/mates-ratelimit.conf
# (Ubuntu's nginx.conf includes /etc/nginx/conf.d/*.conf inside http {}.) Then: sudo nginx -t && sudo systemctl reload nginx
#
# 10 requests/minute per client address for /api/auth/* (used by ops/nginx-api.conf with burst=5).
# A 1 MB zone holds ~16k addresses. Note: keyed per address, so IPv6 clients rotating inside their /64
# are only bounded by the API's own limits (which group IPv6 by /64).
limit_req_zone $binary_remote_addr zone=mates_auth:1m rate=10r/m;
