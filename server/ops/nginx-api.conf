# Include inside the existing HTTPS server block of mates.5.189.173.136.nip.io:
#
#   server {
#     listen 443 ssl;
#     server_name mates.5.189.173.136.nip.io;
#     ...
#     include /etc/nginx/snippets/mates-api.conf;   # <- this file
#   }
#
# Requires: ops/nginx-ratelimit.conf in the http {} context (zone mates_auth) and
#           ops/snippets/mates-security.conf in /etc/nginx/snippets/.
# The API listens on 127.0.0.1:3100 only. Same origin as the static site: no CORS.

location /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    # Real client address for rate limiting (the API trusts these headers only from the proxy).
    # Overwrite, never append, so a client cannot inject its own X-Forwarded-For chain.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_read_timeout    30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    client_max_body_size  1m;

    # Cache-Control is set ONCE: the app's header is hidden and nginx adds a single "no-store"
    # ('always' keeps it on nginx-generated errors such as 502/504 too). Without proxy_hide_header the
    # response would carry the header twice.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    # nginx drops parent add_header directives when a location defines its own,
    # so the shared security headers must be re-included here.
    include snippets/mates-security.conf;

    # Brute-force brake in front of the API's own limits: 10 r/min per address, bursts of 5.
    # Nested location: proxy_pass is not inherited, the proxy_set_header / add_header / include above are.
    location /api/auth/ {
        limit_req zone=mates_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
    }
}
