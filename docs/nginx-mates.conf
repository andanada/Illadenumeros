# Mates Màgiques: PWA estática detrás de HTTPS.
# Copiar a /etc/nginx/sites-available/mates, adaptar server_name/rutas y activar con un enlace en sites-enabled.
# Requiere docs/nginx-mates-security.conf copiado a /etc/nginx/snippets/mates-security.conf.
#
# Despliegue en la RAÍZ del dominio: `root` apunta al contenido de dist/ y `location /` es el de abajo.
# Despliegue en SUBCAMINO (p. ej. https://ejemplo.cat/mates/): el mismo build funciona (base './');
# usa `location /mates/ { alias /var/www/mates/; ... }` y repite los bloques de cache bajo ese prefijo.

# Redirección HTTP -> HTTPS (certbot la genera sola si usas `certbot --nginx`).
server {
    listen 80;
    listen [::]:80;
    server_name mates.ejemplo.cat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mates.ejemplo.cat;

    ssl_certificate     /etc/letsencrypt/live/mates.ejemplo.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mates.ejemplo.cat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/mates;   # contenido de dist/
    index index.html;

    # Compresión. Brotli solo si el módulo ngx_brotli está instalado (descomentar).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include snippets/mates-security.conf;

    # Salida con hash en el nombre (JS, CSS, fuentes): nunca cambia bajo el mismo nombre.
    # Si falta un fichero, 404 de verdad: NO caer a index.html (un chunk antiguo recibiría HTML con 200).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/mates-security.conf;
        try_files $uri =404;
    }

    # Lo que decide qué versión se ejecuta: SIEMPRE revalidar (ETag/Last-Modified siguen funcionando).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/mates-security.conf;
    }
    location ~ ^/(sw\.js|workbox-[\w-]+\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        include snippets/mates-security.conf;
        try_files $uri =404;
    }

    # Iconos e icon.svg: sin hash en el nombre; una semana es suficiente (el SW los precachea igualmente).
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/mates-security.conf;
        try_files $uri =404;
    }
    location = /icon.svg {
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/mates-security.conf;
    }

    # Voz pregenerada (scripts/voice): el nombre del clip es un hash de su contenido, no cambia nunca.
    # El manifest sí cambia al regenerar: siempre revalidar. mp3 ya va comprimido: no se pasa por gzip.
    location /voice/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/mates-security.conf;
        try_files $uri =404;
    }
    location = /voice/manifest.json {
        add_header Cache-Control "no-cache" always;
        include snippets/mates-security.conf;
        try_files $uri =404;
    }

    # Las rutas son hash (#/map), así que el servidor solo ve "/". No hace falta fallback SPA.
    location / {
        try_files $uri $uri/ =404;
    }
}
